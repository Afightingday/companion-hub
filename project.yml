# XcodeGen 工程定义。Yushi.xcodeproj 由 `xcodegen generate` 生成，不入库。
# 公仓 CI（ci/ios-build.yml）与本地 Mac 都从这份文件出工程。
name: Yushi
options:
  bundleIdPrefix: app.yushi
  deploymentTarget:
    iOS: "26.0" # 全量拥抱 Liquid Glass（决策 E）：唯一用户自装，不做 17–25 兼容
  createIntermediateGroups: true

packages:
  YushiKit:
    path: Core
  # 流式 Markdown 渲染内核（微软官方，MIT）。会话页正文归它渲染 ——
  # 逐词淡入只重绘新来的那一截、半截 `**加粗` 会预判成粗体所以不跳版，
  # 这两件是「换个产品也需要」的通用内核，按 CLAUDE.md 第 0 条一律借不自研。
  #
  # **钉的是提交，不是版本号** —— 这不是洁癖，是 SPM 逼的：它自己把 highlightswift
  # 和 iosMath 钉在裸提交上，而 SPM 不允许「按版本号引用的包」再去依赖「按提交引用的包」，
  # 写 exactVersion: 0.7.0 会直接解不出依赖图（2026-08-05 CI 实证：
  # "required using a stable-version but depends on an unstable-version package"）。
  # 改按提交引用之后这条约束不适用。这个哈希 = tag v0.7.0，升级＝人看过 diff 再换哈希。
  SwiftStreamingMarkdown:
    url: https://github.com/microsoft/SwiftStreamingMarkdown
    revision: 5f7c04e0558df6146f90d482edb62cb456986bda

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Yushi:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Media/**"
      # 文件夹引用（保留子路径）：art/… 与设计稿 public/ 同构，
      # particles 三套 p1.png 同名文件靠目录区分，不能拍平成组。
      # 名字禁用 Resources：包根出现该保留名会让 iOS 误判成老式 mac
      # 包布局，安装报 IXErrorDomain 13「Missing bundle ID」（2026-08-01 真机实证）
      - path: App/Media
        type: folder
        buildPhase: resources
    dependencies:
      - package: YushiKit
      # 只挂在 App 靶上，**绝不能进 Core**：Core 要在 Linux 容器里跑单测，
      # 这个包是 UIKit/SwiftUI 的，进去 CI 第一步就红。
      - package: SwiftStreamingMarkdown
        product: SwiftStreamingMarkdown
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 祐识 # 2026-08-01 六审正式定名（曾用名：雨施流形）
        # 本 App 自己没有 .lproj，所有中文都写死在源码里，所以从来不需要声明语言。
        # 但依赖包（SwiftStreamingMarkdown）**是带 .lproj 的**，它那枚代码块拷贝钮
        # 的文案要按 App 支持的语言去查；不声明 zh-Hans，查出来就是英文 "Copy"。
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
          - en
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Media/fonts/LXGWWenKaiScreen.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yushi.ios
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO
        # 正式图标（2026-08-01 祐祐拍板：祐字水墨+藏笑脸，exec-0fecc747 定稿
        # 1254² 重采样 1024² 无 alpha），单尺寸 appiconset
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
