# XcodeGen 工程定义。Yushi.xcodeproj 由 `xcodegen generate` 生成，不入库。
# 公仓 CI（ci/ios-build.yml）与本地 Mac 都从这份文件出工程。
name: Yushi
options:
  bundleIdPrefix: app.yushi
  deploymentTarget:
    iOS: "26.0" # 全量拥抱 Liquid Glass（决策 E）：唯一用户自装，不做 17–25 兼容
  createIntermediateGroups: true

packages:
  YushiKit:
    path: Core

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Yushi:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Media/**"
      # 文件夹引用（保留子路径）：art/… 与设计稿 public/ 同构，
      # particles 三套 p1.png 同名文件靠目录区分，不能拍平成组。
      # 名字禁用 Resources：包根出现该保留名会让 iOS 误判成老式 mac
      # 包布局，安装报 IXErrorDomain 13「Missing bundle ID」（2026-08-01 真机实证）
      - path: App/Media
        type: folder
        buildPhase: resources
    dependencies:
      - package: YushiKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 祐识 # 2026-08-01 六审正式定名（曾用名：雨施流形）
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Media/fonts/LXGWWenKaiScreen.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yushi.ios
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO
