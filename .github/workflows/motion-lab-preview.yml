name: Motion Lab Preview

on:
  workflow_dispatch:
  push:
    branches:
      - codex/line-animation-study
    paths:
      - MotionLab/**
      - project.yml
      - .github/workflows/motion-lab-preview.yml

permissions:
  contents: read

concurrency:
  group: motion-lab-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: iOS 26 simulator capture
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select an available iOS 26 iPhone
        id: simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          data = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )
          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS-26" not in runtime:
                  continue
              candidates.extend(
                  device
                  for device in devices
                  if device.get("isAvailable") and device["name"].startswith("iPhone")
              )
          if not candidates:
              raise SystemExit("No available iOS 26 iPhone simulator")
          selected = candidates[0]
          print(f"Selected {selected['name']} ({selected['udid']})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"udid={selected['udid']}\n")
          PY

      - name: Boot simulator
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build Motion Lab for simulator
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild build \
            -project Yushi.xcodeproj \
            -scheme YushiMotionLab \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath build-motion-lab \
            CODE_SIGNING_ALLOWED=NO

      - name: Install and launch Motion Lab
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          APP_PATH="$(find build-motion-lab/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'YushiMotionLab.app' -print -quit)"
          test -n "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch --terminate-running-process "$UDID" app.yushi.motionlab

      - name: Record video and screenshot
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        shell: bash
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import os
          import queue
          import signal
          import subprocess
          import threading
          import time

          command = [
              "xcrun", "simctl", "io", os.environ["UDID"],
              "recordVideo", "--codec=h264", "artifacts/motion-lab.mp4",
          ]
          recorder = subprocess.Popen(
              command,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1,
          )
          messages = queue.Queue()

          def forward_output():
              for line in recorder.stdout:
                  print(line, end="", flush=True)
                  messages.put(line)
              messages.put(None)

          threading.Thread(target=forward_output, daemon=True).start()
          ready_deadline = time.monotonic() + 120
          while True:
              remaining = ready_deadline - time.monotonic()
              if remaining <= 0:
                  raise RuntimeError("Timed out waiting for Recording started")
              try:
                  message = messages.get(timeout=remaining)
              except queue.Empty as error:
                  raise RuntimeError("Timed out waiting for Recording started") from error
              if message is None:
                  raise RuntimeError(
                      f"Recorder exited before readiness with code {recorder.poll()}"
                  )
              if "Recording started" in message:
                  break

          # 录满一个完整循环还要有富余。起草 v9 的周期是 11.0s(用户定的 0.4× 速度),
          # 原先固定录 10s,连一轮都跑不完。改 24s ≈ 两轮多。
          # 起草周期若再变,这里要一起改。
          time.sleep(24)
          recorder.send_signal(signal.SIGINT)
          try:
              recorder.wait(timeout=30)
          except subprocess.TimeoutExpired:
              recorder.terminate()
              try:
                  recorder.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  recorder.kill()
                  recorder.wait(timeout=10)
          PY
          xcrun simctl io "$UDID" screenshot artifacts/motion-lab.png
          test -s artifacts/motion-lab.mp4
          test -s artifacts/motion-lab.png

      - name: Upload Motion Lab preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-lab-preview
          path: |
            artifacts/motion-lab.mp4
            artifacts/motion-lab.png
          if-no-files-found: error
          retention-days: 30

      - name: Shut down simulator
        if: always()
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl shutdown "$UDID" || true
