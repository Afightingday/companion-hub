<style>
  :root {
    --paper-bg: #F5F2E8;

    --dark-bg: #202823;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper-bg);
    color: var(--ink);
    font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
    padding: 24px 28px 48px;
  }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--ink-muted); margin-bottom: 14px; }

    display: flex; gap: 10px; align-items: center; margin-bottom: 18px;
    font-size: 13px;
  }
  .controls button, .controls select {
    font: inherit; padding: 4px 14px; border: 1px solid #C9C4B2;
    background: var(--paper-card); color: var(--ink); border-radius: 8px; cursor: pointer;
  }
  .controls label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .cards { display: flex; gap: 22px; flex-wrap: wrap; }
  .card {
    background: var(--paper-card); border-radius: 18px; padding: 18px 20px;
    box-shadow: 0 8px 20px rgba(40,20,24,.05);

  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }

  .hero-row { display: flex; gap: 12px; align-items: flex-start; }
  canvas { display: block; border-radius: 12px; }
  .hero { background: var(--paper-card); border: 1px solid #EAE6D6; }
  .hero-dark { background: var(--dark-bg); }
  .size-rows { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .size-row {
    display: flex; gap: 14px; align-items: center; padding: 8px 12px; border-radius: 10px;
  }
  .size-row.paper { background: var(--paper-card); border: 1px solid #EAE6D6; }
  .size-row.dark { background: var(--dark-bg); }
  .size-row .tag { font-size: 10px; width: 34px; color: var(--ink-muted); }
  .size-row.dark .tag { color: #9AA394; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cell span { font-size: 9px; color: var(--ink-muted); }
  .size-row.dark .cell span { color: #9AA394; }

/* =====================================================================
 * 数学(与 Swift 同源)
 * ===================================================================== */
function sub(a,b){return [a[0]-b[0], a[1]-b[1]];}
function add(a,b){return [a[0]+b[0], a[1]+b[1]];}
function mul(a,k){return [a[0]*k, a[1]*k];}
function dist(a,b){return Math.hypot(a[0]-b[0], a[1]-b[1]);}
function lerp(a,b,t){return a+(b-a)*t;}
function lerpPt(a,b,t){return [lerp(a[0],b[0],t), lerp(a[1],b[1],t)];}
function clamp01(x){return Math.min(1, Math.max(0, x));}
function smoothstep(x){x=clamp01(x); return x*x*(3-2*x);}
function easeOutCubic(x){return 1-Math.pow(1-x,3);}
function easeInQuad(x){return x*x;}

function crSegment(p0,p1,p2,p3){
  const alpha = 0.5, eps = 1e-4;
  const d1 = Math.max(eps, Math.pow(dist(p0,p1), alpha));
  const d2 = Math.max(eps, Math.pow(dist(p1,p2), alpha));
  const d3 = Math.max(eps, Math.pow(dist(p2,p3), alpha));
  const b1 = mul(add(sub(mul(p2, d1*d1), mul(p0, d2*d2)),
                     mul(p1, 2*d1*d1 + 3*d1*d2 + d2*d2)),
                 1/(3*d1*(d1+d2)));
  const b2 = mul(add(sub(mul(p1, d3*d3), mul(p3, d2*d2)),
                     mul(p2, 2*d3*d3 + 3*d3*d2 + d2*d2)),
                 1/(3*d3*(d3+d2)));
  return [p1, b1, b2, p2];
}
function cubicAt([p0,c1,c2,p1], t){
  const u = 1-t;
  return [
    u*u*u*p0[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*p1[0],
    u*u*u*p0[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*p1[1],
  ];
}
function samplePath(segments, perSeg=48){
  const pts = [], cum = [0];
  segments.forEach((seg, si) => {
    const start = si === 0 ? 0 : 1;
    for (let i = start; i <= perSeg; i++) pts.push(cubicAt(seg, i/perSeg));
  });
  for (let i = 1; i < pts.length; i++) cum.push(cum[i-1] + dist(pts[i-1], pts[i]));
  const total = cum[cum.length-1];
  return { pts, cum, total };
}
function openCatmullRom(points, perSeg=48){
  const n = points.length, segs = [];
  for (let i = 0; i < n-1; i++) {
    const p0 = points[Math.max(0, i-1)];
    const p3 = points[Math.min(n-1, i+2)];
    segs.push(crSegment(p0, points[i], points[i+1], p3));
  }
  return samplePath(segs, perSeg);
}
function straightPath(a, b){
  const c1 = lerpPt(a, b, 1/3), c2 = lerpPt(a, b, 2/3);
  return samplePath([[a, c1, c2, b]], 24);
}
function pointAt(path, f){
  const target = clamp01(f) * path.total;
  let lo = 0, hi = path.cum.length-1;
  while (lo < hi) { const mid = (lo+hi)>>1; if (path.cum[mid] < target) lo = mid+1; else hi = mid; }
  const i = Math.max(1, lo);
  const span = path.cum[i]-path.cum[i-1] || 1e-9;
  return lerpPt(path.pts[i-1], path.pts[i], (target-path.cum[i-1])/span);
}
/* 二分之三次幂定律(two-thirds power law):人画曲线时速度与曲率呈 v ∝ κ^(-1/3),
 * 弯得越急走得越慢。沿弧长匀速推进正是「机械感」的数学根源。
 * 这里在等弧长采样点上求曲率,据此把「时间」重新分配到弧长上;
 * 速度比夹在 [1/speedRange, speedRange] 内,免得直线段飙速、拐角处停死。 */
function curvatureWarp(path, exponent, speedRange, S=200){
  const v = [];
  for (let i = 0; i <= S; i++){
    const f = i / S, d = 1 / S;
    const a = pointAt(path, Math.max(0, f - d));
    const b = pointAt(path, f);
    const c = pointAt(path, Math.min(1, f + d));
    const ab = Math.hypot(b[0]-a[0], b[1]-a[1]);
    const bc = Math.hypot(c[0]-b[0], c[1]-b[1]);
    const ca = Math.hypot(a[0]-c[0], a[1]-c[1]);
    const area = Math.abs((b[0]-a[0])*(c[1]-a[1]) - (c[0]-a[0])*(b[1]-a[1])) / 2;
    const k = (ab*bc*ca) > 1e-12 ? 4*area/(ab*bc*ca) : 0;   // 三点外接圆曲率
    v.push(Math.pow(k + 1e-4, -exponent));
  }
  const mean = v.reduce((a,b)=>a+b,0) / v.length;
  for (let i = 0; i <= S; i++) v[i] = Math.min(speedRange, Math.max(1/speedRange, v[i]/mean));
  const t = [0];
  for (let i = 1; i <= S; i++) t.push(t[i-1] + (1/S) / ((v[i]+v[i-1])/2));   // dt = ds / v
  const T = t[S];
  for (let i = 0; i <= S; i++) t[i] /= T;
  return { t, S };
}
// 时间比例 p → 弧长比例
function warpAt(w, p){
  const q = clamp01(p);
  let lo = 0, hi = w.S;
  while (lo < hi){ const mid = (lo+hi)>>1; if (w.t[mid] < q) lo = mid+1; else hi = mid; }
  const i = Math.max(1, lo);
  const span = w.t[i] - w.t[i-1] || 1e-9;
  return (i - 1 + (q - w.t[i-1]) / span) / w.S;
}

function slicePoints(path, f0, f1){
  const a = clamp01(f0)*path.total, b = clamp01(f1)*path.total;
  if (b - a < 1e-9) return null;
  const out = [pointAt(path, f0)];
  for (let i = 0; i < path.pts.length; i++) {
    if (path.cum[i] > a && path.cum[i] < b) out.push(path.pts[i]);
  }
  out.push(pointAt(path, f1));
  return out;
}
function drawWindow(ctx, path, scale, tail, head, opts){
  const { color, width, taper, wrap } = opts;
  const masterAlpha = opts.masterAlpha ?? 1;
  const drift = opts.drift ?? [0, 0];
  const headDot = opts.headDot ?? true;
  if (masterAlpha <= 0) return;
  const K = 28;
  const spans = [];
  if (wrap) {
    const t = ((tail % 1) + 1) % 1, h = ((head % 1) + 1) % 1;
    if (t < h) spans.push([t, h]); else spans.push([t, 1], [0, h]);
  } else {
    const t = Math.max(0, tail), h = Math.min(1, head);
    if (h > t) spans.push([t, h]);
  }
  const winLen = head - tail;
  if (winLen <= 1e-9) return;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'butt';
  for (const [s0, s1] of spans) {
    let w0;
    if (!wrap) w0 = (s0 - tail) / winLen;
    else {
      const t = ((tail % 1) + 1) % 1;
      w0 = (s0 >= t - 1e-9 ? s0 - t : s0 + 1 - t) / winLen;
    }
    const kCount = Math.max(2, Math.round(K * (s1 - s0) / winLen));
    for (let k = 0; k < kCount; k++) {
      const f0 = lerp(s0, s1, k/kCount), f1 = lerp(s0, s1, (k+1)/kCount);
      const wMid = w0 + ((k+0.5)/kCount) * (s1-s0)/winLen;
      const alpha = wMid < taper ? smoothstep(wMid/taper) : 1;
      const pts = slicePoints(path, f0, f1);
      if (!pts) continue;
      ctx.globalAlpha = alpha * masterAlpha;
      ctx.beginPath();
      ctx.moveTo((pts[0][0]+drift[0])*scale, (pts[0][1]+drift[1])*scale);
      for (let i=1;i<pts.length;i++) ctx.lineTo((pts[i][0]+drift[0])*scale, (pts[i][1]+drift[1])*scale);
      ctx.stroke();
    }
  }
  if (headDot) {
    const hp = pointAt(path, wrap ? ((head%1)+1)%1 : Math.min(1, head));
    ctx.globalAlpha = masterAlpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc((hp[0]+drift[0])*scale, (hp[1]+drift[1])*scale, width/2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

const gb = DRAFT.glyphBox;

function glyphMap(p){ return [gb.x + p[0]*gb.w, gb.y + p[1]*gb.h]; }
// 每层:轨迹样条 + 单位空间放置矩形 + 位图
const glyphMedians = DRAFT.layers.map(l => {
  const path = openCatmullRom(l.median.map(glyphMap));
  return {
  path,
  warp: curvatureWarp(path, DRAFT.curveExponent, DRAFT.curveSpeedRange),
  maskW: l.maskW,
  dest: {
    x: gb.x + (l.x - gu.x) / gu.w * gb.w,
    y: gb.y + (l.y - gu.y) / gu.h * gb.h,
    w: l.w / gu.w * gb.w,
    h: l.h / gu.h * gb.h,
  },
  img: (() => { const im = new Image(); im.src = GLYPH_ASSET_DATA[l.n]; return im; })(),

// 不用 img.decode():实测它有时永不 settle(图已 complete、naturalWidth>0、HTTP 200 也照挂),
// 会把 ensureAssets 的调用方(sheet/snap)一起吊死。改用 complete+naturalWidth 判据,
// 辅以 load/error 事件,再加超时兜底——宁可少画一层,不可整页卡住。
function whenDecoded(im){
  return new Promise(res => {
    if (im.complete && im.naturalWidth > 0) return res();
    im.addEventListener('load', () => res(), { once: true });
    im.addEventListener('error', () => res(), { once: true });
    setTimeout(res, 3000);
  });
}
async function ensureAssets(){
  if (glyphImgReady) return;
  await Promise.all(glyphMedians.map(m => whenDecoded(m.img)));
  glyphImgReady = true;
}

// 间隙按字形层级分级,部件边界处换气。
const glyphGaps = DRAFT.gapScale.map(s => s * DRAFT.strokeGap);
const glyphSpans = (() => {
  const w = glyphMedians.map(m => Math.pow(m.path.total, DRAFT.isochronyAlpha));
  const sumW = w.reduce((a,b)=>a+b, 0);
  const sumGap = glyphGaps.reduce((a,b)=>a+b, 0);
  const spans = []; let t = 0;
  glyphMedians.forEach((m, i) => {
    const share = (1 - sumGap) * (w[i] / sumW);
    spans.push([t, t + share]);
    t += share + (glyphGaps[i] ?? 0);
  });
  return spans;
})();

// 三次贝塞尔缓动:x→t 用二分(24 次即到浮点精度,且无牛顿迭代的收敛风险)
function cubicBezierEase(x1, y1, x2, y2){
  const bez = (t, a, b) => { const m = 1-t; return 3*m*m*t*a + 3*m*t*t*b + t*t*t; };
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1;
    for (let k = 0; k < 24; k++){
      const t = (lo+hi)/2;
      if (bez(t, x1, x2) < x) lo = t; else hi = t;
    }
    return bez((lo+hi)/2, y1, y2);
  };
}
const travelEase = cubicBezierEase(...DRAFT.travelBezier);

// 单笔节奏:落笔(墨不动,笔降到纸面) → 行笔(墨随缓动推进) → 收笔(墨已满,笔提起带出)。
// prog 同时驱动蒙版揭示与笔位,两者必须同源——各算各的,笔就会脱离墨的前沿。
function strokeRhythm(i, wp){
  const c = DRAFT;
  const [t0, t1] = glyphSpans[i];
  const u = clamp01((wp - t0) / (t1 - t0));
  if (u < c.downFrac){
    const q = u / c.downFrac;
    return { prog: 0, lift: c.landHeight * (1 - smoothstep(q)), drift: 0 };
  }
  if (u > 1 - c.upFrac){
    const q = (u - (1 - c.upFrac)) / c.upFrac;
    const s = smoothstep(q);
    return { prog: 1, lift: c.liftHeight * s, drift: c.liftDrift * s };
  }
  // 行笔:先过整笔的加减速曲线,再经曲率时间扭曲映射到弧长(拐角自动放慢)
  const tt = travelEase((u - c.downFrac) / (1 - c.downFrac - c.upFrac));
  return { prog: warpAt(glyphMedians[i].warp, tt), lift: 0, drift: 0 };
}


// 单笔内的笔尖位置(含离纸高度与出锋带出)
function strokePenPos(i, wp){
  const r = strokeRhythm(i, wp);
  const path = glyphMedians[i].path;
  let p = pointAt(path, r.prog);
  if (r.drift > 0){
    const a = pointAt(path, 0.96), b = pointAt(path, 1);
    const dx = b[0]-a[0], dy = b[1]-a[1], L = Math.hypot(dx, dy) || 1e-6;
    p = [p[0] + dx/L*r.drift, p[1] + dy/L*r.drift];
  }
  return [p[0], p[1] - r.lift];
}

// 书写进度 wp∈[0,1] → 笔尖(笔画内含落笔/收笔;笔画间飞渡小弧)
function glyphTipAt(wp){
  const c = DRAFT;
  for (let i = 0; i < glyphMedians.length; i++) {
    const [t0, t1] = glyphSpans[i];
    if (wp <= t1) {
      if (wp >= t0) return strokePenPos(i, wp);
      // 飞渡:自上一笔的收笔位(已离纸)落到下一笔的落笔位(悬在 landHeight)
      const prevEnd = strokePenPos(i-1, glyphSpans[i-1][1]);
      const s0 = pointAt(glyphMedians[i].path, 0);
      const curStart = [s0[0], s0[1] - c.landHeight];
      const g0 = glyphSpans[i-1][1];
      const q = (wp - g0) / (t0 - g0);
      const s = smoothstep(q);
      return [lerp(prevEnd[0], curStart[0], s),
              lerp(prevEnd[1], curStart[1], s) - c.gapLift*Math.sin(Math.PI*q)];
    }
  }
  return strokePenPos(glyphMedians.length-1, 1);
}

// 全局相位 → 笔尖位置。写 → 悬 → 回笔 → 蓄势 → 写……全程连续,固定倾角纯平移。
function penState(p){
  const c = DRAFT;
  const [w0, w1] = c.writeSpan;
  const startPos = pointAt(glyphMedians[0].path, 0);
  const endPos = pointAt(glyphMedians[glyphMedians.length-1].path, 1);
  if (p >= w0 && p < w1) {
    return { pos: glyphTipAt((p - w0) / (w1 - w0)) };
  }
  if (p >= w1 && p < c.hoverEnd) {
    const q = (p - w1) / (c.hoverEnd - w1);
    return { pos: [endPos[0], endPos[1] - c.hoverBob*Math.sin(2*Math.PI*q)] };
  }
  // 回笔(hoverEnd→returnSpan[1])与蓄势(其后至 w0,含跨 0)
  let q = 1;
  if (p >= c.returnSpan[0] && p < c.returnSpan[1]) {
    q = (p - c.returnSpan[0]) / (c.returnSpan[1] - c.returnSpan[0]);
  }
  if (q >= 1) {
    // 蓄势:悬在起笔位,轻轻呼吸
    const q2 = p >= c.returnSpan[1] ? (p - c.returnSpan[1]) / (1 - c.returnSpan[1] + w0) : (p + 1 - c.returnSpan[1]) / (1 - c.returnSpan[1] + w0);
    return { pos: [startPos[0], startPos[1] - 0.004 - c.hoverBob*0.6*Math.sin(Math.PI*clamp01(q2))] };
  }
  const s = smoothstep(q);
  return {
    pos: [lerp(endPos[0], startPos[0], s), lerp(endPos[1], startPos[1], s) - c.hopLift*Math.sin(Math.PI*q)],
  };
}

function drawPen(ctx, sizePx, phase, dark){
  const c = DRAFT;
  const st = penState(phase);
  const color = dark ? PALETTE.inkOnDark : PALETTE.ink;
  const s = (c.penLenUnit * sizePx) / PEN_SVG_LEN;
  ctx.save();
  ctx.translate(st.pos[0]*sizePx, st.pos[1]*sizePx);
  ctx.rotate(c.penAngle);          // 固定倾角(v9 试过随行笔方向倾靠,抖动明显,已回退)
  ctx.scale(s, s);
  ctx.translate(-PEN_TIP[0], -PEN_TIP[1]);
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const p of penMainPaths) {
    ctx.lineWidth = Math.max(p.w * c.penWeight, c.penMinPx / s);   // SVG 线宽 × 加粗系数
    ctx.stroke(p.path);
  }
  if (sizePx >= c.penDetailMin) {
    for (const p of penDetailPaths) {
      ctx.lineWidth = Math.max(p.w * c.penWeight, c.penMinPx / s);
      ctx.stroke(p.path);
    }
  }
  ctx.restore();
}

// 蒙版揭示:笔过墨现——离屏画蒙版并集,source-in 揭示真墨迹,再染墨色
const offCache = new Map();
function getOff(sizePx, tag){
  const key = (tag || 'a') + ':' + sizePx;
  let o = offCache.get(key);
  if (!o) {
    const dpr = 2;
    const cv = document.createElement('canvas');
    cv.width = sizePx * dpr; cv.height = sizePx * dpr;
    const c = cv.getContext('2d'); c.scale(dpr, dpr);
    o = { cv, ctx: c };
    offCache.set(key, o);
  }
  return o;
}

function drawDraft(ctx, sizePx, phase, dark){
  const c = DRAFT;
  const ink = dark ? PALETTE.inkOnDark : PALETTE.ink;
  const [w0, w1] = c.writeSpan;
  let writeP;
  if (phase < w0) writeP = 0;
  else if (phase < w1) writeP = (phase - w0) / (w1 - w0);
  else writeP = 1;
  let masterAlpha = 1, driftY = 0;
  if (phase >= c.fadeSpan[0]) {
    const q = clamp01((phase - c.fadeSpan[0]) / (c.fadeSpan[1] - c.fadeSpan[0]));
    masterAlpha = 1 - smoothstep(q);
    driftY = c.sinkDrift * q;
  }
  if (glyphImgReady && masterAlpha > 0 && writeP > 0) {
    const off = getOff(sizePx, 'a'), octx = off.ctx;
    octx.clearRect(0, 0, sizePx, sizePx);
    octx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < glyphMedians.length; i++) {
      const m = glyphMedians[i];
      const [t0, t1] = glyphSpans[i];
      const d = m.dest;
      if (writeP >= t1) {
        // 已写完:整层直画(零蒙版开销)
        octx.drawImage(m.img, d.x*sizePx, d.y*sizePx, d.w*sizePx, d.h*sizePx);
        continue;
      }
      if (writeP <= t0) continue;
      // 活动层:蒙版只揭示本层。进度与笔位同源(strokeRhythm),落笔段 prog=0 故无墨。
      const prog = strokeRhythm(i, writeP).prog;
      const pts = slicePoints(m.path, 0, prog);
      if (!pts) continue;
      const o2 = getOff(sizePx, 'b'), b = o2.ctx;
      b.clearRect(0, 0, sizePx, sizePx);
      b.globalCompositeOperation = 'source-over';
      b.lineCap = 'round'; b.lineJoin = 'round';
      b.strokeStyle = '#000';
      b.lineWidth = m.maskW * sizePx;
      b.beginPath();
      b.moveTo(pts[0][0]*sizePx, pts[0][1]*sizePx);
      for (let k = 1; k < pts.length; k++) b.lineTo(pts[k][0]*sizePx, pts[k][1]*sizePx);
      b.stroke();
      b.globalCompositeOperation = 'source-in';
      b.drawImage(m.img, d.x*sizePx, d.y*sizePx, d.w*sizePx, d.h*sizePx);
      b.globalCompositeOperation = 'source-over';
      octx.drawImage(o2.cv, 0, 0, sizePx, sizePx);
    }
    // 统一染墨色;整体透明度 + 墨沉在落画布时应用
    octx.globalCompositeOperation = 'source-in';
    octx.fillStyle = ink;
    octx.fillRect(0, 0, sizePx, sizePx);
    octx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = masterAlpha;
    ctx.drawImage(off.cv, 0, driftY*sizePx, sizePx, sizePx);
    ctx.globalAlpha = 1;
  }
  drawPen(ctx, sizePx, phase, dark);
}

/* =====================================================================
 * 搜索|拾音
 * ===================================================================== */
const rainDirN = (() => { const d = RAINFALL.dir, m = Math.hypot(d[0], d[1]); return [d[0]/m, d[1]/m]; })();
const rainLanes = RAINFALL.lanes.map(l => {
  const L = (l.yLand - RAINFALL.yTop) / rainDirN[1];
  const start = [l.x0, RAINFALL.yTop];
  const land = add(start, mul(rainDirN, L));
  return { ...l, path: straightPath(start, land), land };
});

function drawRainfall(ctx, sizePx, phase, dark){
  const c = RAINFALL;
  const total = c.active + c.rest;
  const p = phase * total / c.active;
  if (p >= 1) return;
  const w = lineWidthFor(sizePx) * c.widthScale;
  const ink = dark ? PALETTE.inkOnDark : PALETTE.ink;
  const blue = dark ? PALETTE.rainBlueOnDark : PALETTE.rainBlue;

  for (const lane of rainLanes) {
    const u = (p - lane.born) / lane.dur;
    if (u > 0) {
      let head, tail;
      if (lane.hit) {
        const cu = clamp01(u);
        head = lerp(cu, easeOutCubic(cu), c.hitEase);
        tail = head - lane.len;
        if (u > 1) {
          const q = clamp01((p - (lane.born + lane.dur)) / c.absorbDur);
          tail = lerp(head - lane.len, 1, smoothstep(q));
        }
      } else {
        head = u * (1 + lane.len);
        tail = head - lane.len;
      }
      if (tail < 1) {
        drawWindow(ctx, lane.path, sizePx, tail, Math.min(1, head), {
          color: ink, width: w, taper: c.tailTaper, wrap: false,
          masterAlpha: lane.alpha,
          headDot: false,
        });
      }
    }
    if (!lane.hit) {
      const tLand = lane.born + lane.dur / (1 + lane.len);
      const q = (p - tLand) / c.microRipple.dur;
      if (q > 0 && q < 1) {
        const rr = lerp(c.microRipple.r0, c.microRipple.r1, easeOutCubic(q)) * w;
        ctx.globalAlpha = c.microRipple.alpha * (1 - q) * lane.alpha;
        ctx.strokeStyle = ink;
        ctx.lineWidth = Math.max(0.4, w * 0.3);
        ctx.beginPath();
        ctx.ellipse(lane.land[0]*sizePx, lane.land[1]*sizePx, rr, rr * c.ringSquash, 0, 0, Math.PI*2);
        ctx.stroke();
      }
    }
  }

  const hit = rainLanes.find(l => l.hit);
  const hitAt = hit.born + hit.dur;
  const tb = p - hitAt;
  if (tb > 0 && tb < c.bloom.rise + c.bloom.fall) {
    const rise = clamp01(tb / c.bloom.rise);
    const fall = clamp01((tb - c.bloom.rise) / c.bloom.fall);
    const alpha = easeOutCubic(rise) * (1 - easeInQuad(fall));
    const r = c.bloom.r * w * (0.55 + 0.45 * easeOutCubic(rise));
    const cx = hit.land[0]*sizePx, cy = hit.land[1]*sizePx;
    ctx.fillStyle = blue;
    ctx.globalAlpha = alpha * c.bloom.haloA;
    ctx.beginPath(); ctx.arc(cx, cy, r * c.bloom.haloR, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = alpha * c.bloom.coreA;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  }
  for (const ring of c.rings) {
    const q = (tb - ring.delay) / ring.dur;
    if (q > 0 && q < 1) {
      const rr = lerp(ring.r0, ring.r1, easeOutCubic(q)) * w;
      ctx.globalAlpha = ring.alpha * (1 - q);
      ctx.strokeStyle = blue;
      ctx.lineWidth = Math.max(0.4, w * c.ringWidth * (1 - 0.7 * q));
      ctx.beginPath();
      ctx.ellipse(hit.land[0]*sizePx, hit.land[1]*sizePx, rr, rr * c.ringSquash, 0, 0, Math.PI*2);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

/* =====================================================================
 * 骨架 / 配准底稿
 * ===================================================================== */
function drawDraftSkeleton(ctx, sizePx){
  // 九层原图垫底(配准)+ 红色隐藏轨迹
  if (glyphImgReady) {
    ctx.globalAlpha = 0.30;
    glyphMedians.forEach(m => {
      const d = m.dest;
      ctx.drawImage(m.img, d.x*sizePx, d.y*sizePx, d.w*sizePx, d.h*sizePx);
    });
    ctx.globalAlpha = 1;
  }
  ctx.lineWidth = 1;
  glyphMedians.forEach(m => {
    ctx.strokeStyle = 'rgba(180,40,40,0.6)';
    ctx.beginPath();
    m.path.pts.forEach((p,i)=> i ? ctx.lineTo(p[0]*sizePx, p[1]*sizePx) : ctx.moveTo(p[0]*sizePx, p[1]*sizePx));
    ctx.stroke();
  });
}
function drawRainfallSkeleton(ctx, sizePx){
  ctx.globalAlpha = 1; ctx.lineWidth = 1;
  rainLanes.forEach(lane => {
    ctx.strokeStyle = lane.hit ? 'rgba(180,40,40,0.6)' : 'rgba(120,60,40,0.3)';
    ctx.beginPath();
    lane.path.pts.forEach((p,i)=> i ? ctx.lineTo(p[0]*sizePx, p[1]*sizePx) : ctx.moveTo(p[0]*sizePx, p[1]*sizePx));
    ctx.stroke();
    ctx.fillStyle = 'rgba(180,40,40,0.6)';
    ctx.beginPath(); ctx.arc(lane.land[0]*sizePx, lane.land[1]*sizePx, 2.5, 0, Math.PI*2); ctx.fill();
  });
}

/* =====================================================================
 * 页面装配 + 播放器 + 接触表
 * ===================================================================== */
const DESIGNS = [
  { id: 'draft', title: 'Thinking|起草(钢笔写祐)', meta: '4.4s · 写-悬-墨沉-回笔 · 无缝 · 纯墨',
    cycle: DRAFT.cycle, draw: drawDraft, skeleton: drawDraftSkeleton },
  { id: 'rainfall', title: '搜索|拾音(斜雨涟漪)', meta: '1.7s + 0.4s 停顿 · 雨蓝命中(水面已下移)',
    cycle: RAINFALL.active + RAINFALL.rest, draw: drawRainfall, skeleton: drawRainfallSkeleton },
];
const registry = [];

function makeCanvas(sizePx, dark, design, hero){
  const dpr = window.devicePixelRatio || 1;
  const cv = document.createElement('canvas');
  cv.width = sizePx * dpr; cv.height = sizePx * dpr;
  cv.style.width = sizePx + 'px'; cv.style.height = sizePx + 'px';
  cv.className = dark ? 'hero-dark' : (hero ? 'hero' : '');
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  registry.push({ cv, ctx, sizePx, dark, design, hero });
  return cv;
}

const cardsEl = document.getElementById('cards');
for (const d of DESIGNS) {
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<h2>${d.title}</h2><div class="meta">${d.meta}</div>`;
  const heroRow = document.createElement('div'); heroRow.className = 'hero-row';
  heroRow.appendChild(makeCanvas(240, false, d, true));
  heroRow.appendChild(makeCanvas(140, true, d, true));
  card.appendChild(heroRow);
  const sizeRows = document.createElement('div'); sizeRows.className = 'size-rows';
  for (const dark of [false, true]) {
    const row = document.createElement('div');
    row.className = 'size-row ' + (dark ? 'dark' : 'paper');
    row.innerHTML = `<div class="tag">${dark ? '深底' : '纸面'}</div>`;
    for (const s of [20, 24, 28]) {
      const cell = document.createElement('div'); cell.className = 'cell';
      cell.appendChild(makeCanvas(s, dark, d, false));
      cell.insertAdjacentHTML('beforeend', `<span>${s}</span>`);
      row.appendChild(cell);
    }
    sizeRows.appendChild(row);
  }
  card.appendChild(sizeRows);
  cardsEl.appendChild(card);
}

let playing = true, speed = 1, vt = 0, last = performance.now(), rafId = null;
const btnPlay = document.getElementById('btnPlay');
const skeletonBox = document.getElementById('skeleton');
const clock = document.getElementById('clock');

function renderAll(){
  clock.textContent = 't = ' + vt.toFixed(2) + 's';
  for (const r of registry) {
    r.ctx.clearRect(0, 0, r.sizePx, r.sizePx);
    const phase = (vt % r.design.cycle) / r.design.cycle;
    r.design.draw(r.ctx, r.sizePx, phase, r.dark);
    if (r.hero && !r.dark && skeletonBox.checked) r.design.skeleton(r.ctx, r.sizePx);
  }
}
function frame(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) vt += dt * speed;
  renderAll();
  rafId = playing ? requestAnimationFrame(frame) : null;
}
function ensureRunning(){ last = performance.now(); if (rafId == null) rafId = requestAnimationFrame(frame); }
btnPlay.onclick = () => {
  playing = !playing; btnPlay.textContent = playing ? '暂停' : '播放';
  if (playing) ensureRunning(); else renderAll();
};
document.getElementById('btnRestart').onclick = () => { vt = 0; if (!playing) renderAll(); };
document.getElementById('speed').onchange = e => { speed = +e.target.value; };
skeletonBox.onchange = () => { if (!playing) renderAll(); };
window.snap = t => { playing = false; btnPlay.textContent = '播放'; vt = t; renderAll(); return 't=' + t; };
window.resume = () => { playing = true; btnPlay.textContent = '暂停'; ensureRunning(); return 'playing'; };
ensureRunning();

window.sheet = async (id, times, opt = {}) => {
  const d = DESIGNS.find(x => x.id === id);
  if (!d) return 'unknown design';
  await ensureAssets();
  const size = opt.size ?? 200, cols = opt.cols ?? 4, dark = !!opt.dark, skel = !!opt.skel;
  const pad = 10, label = 16;
  const rows = Math.ceil(times.length / cols);
  const W = cols * (size + pad) + pad, H = rows * (size + label + pad) + pad;
  const cv = document.createElement('canvas');
  const dpr = 2;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.fillStyle = dark ? '#202823' : '#FBF9F1';
  ctx.fillRect(0, 0, W, H);
  times.forEach((t, i) => {
    const cx = pad + (i % cols) * (size + pad);
    const cy = pad + Math.floor(i / cols) * (size + label + pad);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = dark ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, size - 1, size - 1);
    const phase = (t % d.cycle) / d.cycle;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, size, size); ctx.clip();
    d.draw(ctx, size, phase, dark);
    if (skel) d.skeleton(ctx, size);
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.fillStyle = dark ? '#9AA394' : '#7C8477';
    ctx.font = '10px sans-serif';
    ctx.fillText('t=' + t.toFixed(2) + ' p=' + phase.toFixed(2), 3, size + 12);
    ctx.restore();
  });
  const name = opt.name ?? (id + (dark ? '-dark' : '') + (skel ? '-skel' : '') + '.png');
  const res = await fetch('/save?name=' + encodeURIComponent(name), { method: 'POST', body: cv.toDataURL('image/png') });
  return await res.text();
};
</script>
